# Task registry for doc-sync
# Bot regenerates: status cells, checkboxes, totals, header %, "What's left",
#                  "Order of attack", progress table, work-history bullets
# Human edits preserved: baseline paragraph, Definition of done, Deferred findings, How-to-update
#
# Fields:
#   id            - Task ID (matches Assignment.md + Snapshot.md markers)
#   title         - Display name
#   owner         - Moinul | Fatin | Shafin
#   order         - Sort key for "Order of attack" (lower = higher priority)
#   paths         - Evidence globs (matched against PR changed files)
#   hint          - One-line description while task is not done
#   also_completes - Other task IDs that get marked done when this merges (optional)
#
# Moinul — core + infrastructure (M1–M3)
