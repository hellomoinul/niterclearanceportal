# Task registry for doc-sync (v2)
# Bot regenerates: task bullets (⬜ → ✅), header progress %, work history.
# Human edits preserved: everything else in Snapshot.md.
#
# Fields:
#   id            - Task ID (matches Snapshot.md task markers)
#   title         - Display name
#   owner         - Moinul | Fatin | Shafin
#   order         - Sort key for "next work" hints (lower = higher priority)
#   paths         - Evidence globs (matched against PR changed files)
#   hint          - One-line description while task is not done
#   also_completes - Other task IDs that get marked done when this merges (optional)
#
# v2 lanes: Moinul = backend/infra, Fatin = student/certificate, Shafin = admin/queue.
tasks:
  # Moinul — backend, migrations, integration
  - id: M-v2.1
    title: "Migration: 10-office reseed"
    owner: Moinul
    order: 10
    paths: ["supabase/migrations/*v2_sequential_clearance*", "supabase/migrations/*"]
    hint: "Re-seed 10 office rows, is_final_signoff on Administration, drop legacy 8 rows"

  - id: M-v2.2
    title: "Program normalization + data purge"
    owner: Moinul
    order: 11
    paths: ["supabase/migrations/*", "supabase/consolidated_setup.sql"]
    hint: "Normalize program values (CSE), truncate all test data"

  - id: M-v2.3
    title: "Sequential review triggers"
    owner: Moinul
    order: 12
    paths: ["supabase/migrations/*", "supabase/consolidated_setup.sql"]
    hint: "create_department_reviews creates first office only; next review on approval; drop head-ordering/triggered"

  - id: M-v2.4
    title: "Upload RLS gate"
    owner: Moinul
    order: 13
    paths: ["supabase/migrations/*", "supabase/consolidated_setup.sql"]
    hint: "Reject document uploads to any review that is not the active unlocked step"

  - id: M-v2.5
    title: "declare_review_na RPC"
    owner: Moinul
    order: 14
    paths: ["supabase/migrations/*", "supabase/*na*", "supabase/consolidated_setup.sql"]
    hint: "Replace declare_departments_na(array) with declare_review_na(review_id)"

  - id: M-v2.6
    title: "Regenerate DB types + build verify"
    owner: Moinul
    order: 15
    paths: ["supabase/types.ts", "supabase/types/*", "src/integrations/supabase/types.ts"]
    hint: "npx tsc --noEmit + npx vite build + live spot-checks"

  - id: M-v2.7
    title: "Integration pass + e2e"
    owner: Moinul
    order: 16
    paths: ["src/**/*", "supabase/migrations/*"]
    hint: "Fix RLS/sequencing edges surfaced by UI PRs; end-to-end on live"

  - id: M-v2.8
    title: "Dead-code + copy cleanup"
    owner: Moinul
    order: 17
    paths: ["src/**/*", "supabase/**/*"]
    hint: "Remove 8-office model leftovers and obsolete strings"

  # Fatin — student / certificate lane
  - id: F-v2.1
    title: "Apply form v2"
    owner: Fatin
    order: 20
    paths: ["src/routes/_authenticated/apply.tsx", "src/lib/departments.ts"]
    hint: "Program dropdown (strict 5), drop gender/thesis/bulk-N-A, sequential copy"

  - id: F-v2.2
    title: "Dashboard stepper"
    owner: Fatin
    order: 21
    paths: ["src/routes/_authenticated/dashboard.tsx"]
    hint: "Vertical stepper: locked/active/approved/N-A; 'Clearance not received from [office]'"

  - id: F-v2.3
    title: "Section page lock + N/A"
    owner: Fatin
    order: 22
    paths: ["src/routes/_authenticated/section.$code.tsx"]
    hint: "Lock state (no upload) for non-unlocked offices; per-office N/A button"

  - id: F-v2.4
    title: "Guide / marketing copy"
    owner: Fatin
    order: 23
    paths: ["src/routes/guide.tsx", "src/routes/about.tsx", "src/routes/index.tsx"]
    hint: "Rewrite hardcoded 'Department Head / 7/8 / parallel' strings for the sequential model"

  # Shafin — office / admin panel lane
  - id: S-v2.1
    title: "Office Editor"
    owner: Shafin
    order: 30
    paths: ["src/routes/_authenticated/admin/offices.tsx", "src/routes/_authenticated/admin/workflow.tsx"]
    hint: "CRUD over the 10 offices (name/requirement/doc-hint/order/final)"

  - id: S-v2.2
    title: "Users page — one office per staff"
    owner: Shafin
    order: 31
    paths: ["src/routes/_authenticated/admin/users.tsx", "src/routes/_authenticated/admin/route.tsx"]
    hint: "Real CRUD; bind each registrar account to exactly one of the 10 offices (teacher's role rule)"

  - id: S-v2.3
    title: "Queue — office filter + search"
    owner: Shafin
    order: 32
    paths: ["src/routes/_authenticated/queue.tsx"]
    hint: "Role-scoped office queue, search/pagination, rejection history, bulk summary"

  - id: S-v2.4
    title: "Admin override + N/A revert"
    owner: Shafin
    order: 33
    paths: ["src/routes/_authenticated/admin/index.tsx"]
    hint: "Override approve/reject (mandatory reason + audit), revert false N/A (reopen_na_review RPC)"

  - id: S-v2.5
    title: "Reports / audit / notices verify"
    owner: Shafin
    order: 34
    paths: ["src/routes/_authenticated/admin/reports.tsx", "src/routes/_authenticated/admin/audit.tsx", "src/routes/_authenticated/admin/notices.tsx"]
    hint: "Verify labels/counts against the 10-office set"